name: Update Documentation References

on:
  schedule:
    - cron: '0 6 * * 0'  # Sunday 6am UTC
  workflow_dispatch:

permissions: {}

jobs:
  update-references:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt
      - name: Run update pipeline
        id: pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SECURITY_REVIEW_REPORT: ${{ runner.temp }}/security-review.md
        # No GITHUB_TOKEN: the GitHub source runs unauthenticated. Every repo/wiki
        # is public, so a token grants no access — it would only lift the 60 req/hr
        # anonymous rate limit. The pipeline throttles to that limit instead
        # (see github_repos._github_get rate-limit handling).
        run: python scripts/update_references.py
# Note: no lint/type/test steps — ruff/mypy/pytest are local-only dev tools, not published in CI.
      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      - name: Bump plugin version (CalVer YYYY.DOY.patch)
        id: bump
        if: steps.changes.outputs.changed == 'true'
        run: |
          python <<'PYEOF'
          import datetime, json, os
          from pathlib import Path

          today = datetime.date.today()
          y, d = today.year, today.timetuple().tm_yday  # day-of-year, 1-indexed

          path = Path('.claude-plugin/plugin.json')
          data = json.loads(path.read_text())
          parts = data['version'].split('.')

          # If the current version is already today's CalVer, bump the patch.
          # Otherwise (different day, or non-CalVer like '1.0.0'), reset to today's
          # date with patch=0. DOY is zero-padded to 3 digits so lexicographic
          # comparison (Claude Code's known-buggy comparator) sorts correctly:
          # '2026.099.0' < '2026.100.0' (would otherwise compare wrong).
          if len(parts) == 3 and parts[0] == str(y) and parts[1] == f'{d:03d}':
              new_patch = int(parts[2]) + 1
          else:
              new_patch = 0

          new_version = f'{y}.{d:03d}.{new_patch}'
          data['version'] = new_version
          path.write_text(json.dumps(data, indent=2) + '\n')
          print(f'Bumped plugin version to {new_version}')

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'version={new_version}\n')
          PYEOF
      - name: Build PR body with security report
        id: pr-body
        if: steps.changes.outputs.changed == 'true'
        env:
          PLUGIN_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          {
            echo "Automated weekly update of documentation reference summaries."
            echo ""
            echo "Plugin version bumped to **v${PLUGIN_VERSION}** (CalVer: \`YYYY.DOY.patch\`)."

            if [ -f "$RUNNER_TEMP/security-review.md" ]; then
              echo ""
              echo "## Security Review"
              cat "$RUNNER_TEMP/security-review.md"
            else
              echo ""
              echo "_Security review report not generated._"
            fi
          } > "$RUNNER_TEMP/pr-body.md"
      - name: Create PR
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          title: 'docs: weekly reference update (v${{ steps.bump.outputs.version }})'
          body-path: ${{ runner.temp }}/pr-body.md
          branch: docs/weekly-update
          commit-message: 'docs: update reference summaries (v${{ steps.bump.outputs.version }})'
          token: ${{ secrets.GITHUB_TOKEN }}
          labels: ${{ steps.pipeline.outputs.security_flagged == 'true' && 'needs-security-review' || '' }}
